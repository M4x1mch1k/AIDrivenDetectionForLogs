# Local alpha stack: Kafka + OPA.
# Python middleware/producer run on the host (see README) — not containerized yet.
#
# middleware (placeholder):
#   image: python:3.11-slim
#   working_dir: /app
#   volumes: [.:/app]
#   command: ["python", "src/middleware.py"]
#   depends_on: [kafka, opa]
#   environment:
#     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
#     OPA_URL: http://opa:8181/v1/data/aws/s3/compliance/deny

services:
  kafka:
    # bitnami/kafka public tags moved to bitnamilegacy; 3.9 alone does not exist.
    image: bitnamilegacy/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (no ZooKeeper)
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  opa:
    image: openpolicyagent/opa:0.70.0
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
    # Official OPA image is minimal (no curl/wget); readiness is checked via host curl in README.
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
